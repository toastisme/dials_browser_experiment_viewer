<!DOCTYPE html>
<html lang="en">
<head>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Experiment</title>
	<style>
		body{
			margin: 0
		}
		::-webkit-scrollbar { width: 6px; height: 6px; }
		::-webkit-scrollbar-track { background: transparent; }
		::-webkit-scrollbar-thumb { background: hsl(217.2 32.6% 28%); border-radius: 3px; }
		::-webkit-scrollbar-thumb:hover { background: hsl(217.2 32.6% 40%); }
		::-webkit-scrollbar-corner { background: transparent; }
	</style>

<body>
	<header id="headerText"> </header>
	<div id="viewToggle" style="display: none" role="group" aria-label="Panel view">
		<button id="view3DButton" class="view-toggle-button active" aria-pressed="true">3D</button>
		<button id="view2DButton" class="view-toggle-button" aria-pressed="false">2D</button>
	</div>
	<sidebar id="sidebar" class="hidden" style="width: 230px; padding: 10px;"> 
		<button id="sidebarToggle" onclick="window.viewer.toggleSidebar()" aria-label="Toggle sidebar">
			❮
		</button>
		<script>
			// Wrapper functions to prevent mouse events triggering underneath sidebar

			function updateObservedUnindexedReflections(){
				window.viewer.disableMouseClick(); 
				window.viewer.updateObservedUnindexedReflections()
			}

			function updateObservedIndexedReflections(){
				window.viewer.disableMouseClick(); 
				window.viewer.updateObservedIndexedReflections()
			}

			function updateCalculatedReflections(){
				window.viewer.disableMouseClick(); 
				window.viewer.updateCalculatedReflections()
			}

			function updateIntegratedReflections(){
				window.viewer.disableMouseClick(); 
				window.viewer.updateIntegratedReflections()
			}

			function updateBoundingBoxes(){
				window.viewer.disableMouseClick();
				window.viewer.updateBoundingBoxes();
			}

			function updateIntegratedBoundingBoxes(){
				window.viewer.disableMouseClick();
				window.viewer.updateIntegratedBoundingBoxes();
			}

			function updateAxes(){
				window.viewer.disableMouseClick(); 
				window.viewer.updateAxes()
			}

			function updateReflectionSize(){
				window.viewer.disableMouseClick();
				window.viewer.updateReflectionSize();
			}
			function updateUserContrast(){
				window.viewer.disableMouseClick();
				window.viewer.updatePanelTextures();
			}

		    function toggleSidebar() {
				const sidebar = document.getElementById("sidebar");
				const toggleBtn = document.getElementById("sidebarToggle");

				const isHidden = sidebar.classList.toggle("hidden");

				toggleBtn.textContent = isHidden ? "Show sidebar" : "Hide sidebar";
			}


		</script>

			<div class="slider-container panel-nav-row">
				<b>panel:</b>
				<button id="panelPrev" class="image-step" aria-label="Previous panel"><i class="fa fa-chevron-left"></i></button>
				<span id="panelName2D" class="panel-name"></span>
				<button id="panelNext" class="image-step" aria-label="Next panel"><i class="fa fa-chevron-right"></i></button>
			</div>
		</div>

		<div id="imageControls" style="display: none">
			<div class="slider-container image-slider-row">
				<b>image:</b>
				<button id="imagePrev" class="image-step" aria-label="Previous image"><i class="fa fa-chevron-left"></i></button>
				<input type="range" min="1" max="1" value="1" step="1" class="slider" id="imageSlider">
				<button id="imageNext" class="image-step" aria-label="Next image"><i class="fa fa-chevron-right"></i></button>
			</div>
			<div class="image-input-row">
				<label for="imageNumber"><b>number:</b></label>
				<input type="number" min="1" value="1" step="1" id="imageNumber" class="image-input">
				<span id="numImagesText"></span>
			</div>
			<div class="image-input-row">
				<label for="imageStack"><b>stack:</b></label>
				<input type="number" min="1" value="1" step="1" id="imageStack" class="image-input">
			</div>
		</div>

		<div class="checkbox-row" id="observedUnindexedReflectionsRow">
		<span style="color: #aa9a9a"><b>unindexed reflections:</b></span><input type="checkbox"
		id="observedUnindexedReflections"
		onclick="updateObservedUnindexedReflections()" disabled>
		</div>

		<div class="checkbox-row" id="observedIndexedReflectionsRow">
		<span style="color: #e74c3c"><b>indexed reflections:</b> </span><input type="checkbox"
		id="observedIndexedReflections"
		onclick="updateObservedIndexedReflections()" disabled>
		</div>

		<div class="checkbox-row" id="calculatedReflectionsRow">
		<span style="color: #ffaaaa"><b>calculated reflections:</b> </span><input type="checkbox"
		id="calculatedReflections"
		onclick="updateCalculatedReflections()" disabled>
		</div>

		<div class="checkbox-row" id="integratedReflectionsRow">
		<span style="color: #ffc25c"><b>integrated reflections:</b> </span><input type="checkbox"
		id="integratedReflections"
		onclick="updateIntegratedReflections()" disabled>
		</div>

		<div class="checkbox-row" id="boundingBoxesRow">
		<b>observed bounding boxes:</b> <input type="checkbox" id="boundingBoxes"
		onclick="updateBoundingBoxes()" disabled>
		</div>

		<div class="checkbox-row" id="integratedBoundingBoxesRow">
		<span style="color: #ffc25c"><b>integrated bounding boxes:</b> </span><input type="checkbox"
		id="integratedBoundingBoxes"
		onclick="updateIntegratedBoundingBoxes()" disabled>
		</div>

		class="slider" id="reflectionSizeSlider"

		</div>

		<div id="contrastContainer" class="slider-container">

		onmouseup="updateUserContrast()"  style="margin-top: 10px; vertical-align: middle; position: relative; top: -3px;">
		</div>

			<div id="experimentDropdown" class="dropdown-content">
			</div>

	<script type="module">
	import { ExperimentViewer, setupScene } from "./src/js/ExperimentViewer.js";
	import { ExptParser } from "dials_javascript_parser/ExptParser.js";
	import { ReflParser } from "dials_javascript_parser/ReflParser.js";
	import { deserialize, decode } from "@ygoe/msgpack";


	function isExperimentViewerMsg(msg){
		return "channel" in msg && msg["channel"] == "experiment_viewer";
	}

	// The host app passes its server's port as ?port=<n> on this page's URL.
	const serverPort = new URLSearchParams(window.location.search).get("port") || "50010";
	const serverWSAddr = `ws://127.0.0.1:${serverPort}/`;

	const colors = {
			"background": 0x020817,
      "backgroundLight": 0xc6ccd2,
			"sample" : 0xfdf6e3,
			"reflectionObsUnindexed": [
				0x96f97b,
				0x75bbfd,
				0xbf77f6,
				0x13eac9,
				0xffb07c,
				0xffd1df,
				0xd0fefe,
				0xffff84,
				0xffffff,
				0xff9408,
				0x01f9c6,
				0xaefd6c,
				0xfe0002,
				0x990f4b,
				0x78d1b6,
				0xfff917,
				0xff0789,
				0xd4ffff,
				0x69d84f,
				0x56ae57
			],
			"reflectionObsIndexed" : 0xe74c3c,
			"reflectionCal" : 0xffaaaa,
			"reflectionIntegrated" : 0xffc25c,
			"panel" : 0x7aa8cc,
			"panelLight" : 0x2a5a7a,
			"highlight" : 0xb8ddf5,
			"highlightLight" : 0x1a3a5c,
			"beam" : 0xFFFFFF,
			"bbox" : 0xdddddd,
			"axes": [0xffaaaa, 0xaaffaa, 0xaaaaff],
			"highlightBbox" : 0x96f97b,
			"createNewReflectionBbox" : 0xffb07c
	};

	window.onload = function(){
		window.viewer = new ExperimentViewer(
			new ExptParser(), 
			new ReflParser(), 
			new ReflParser(), 
			false,
			colors
		);
		window.viewer.serverWS = new WebSocket(serverWSAddr);
		window.viewer.serverWS.binaryType = "arraybuffer";

		window.viewer.serverWS.onopen = () => {
			console.log('Experiment viewer opened Connection to server');

		window.viewer.serverWS.send(JSON.stringify({
			"channel": "server",
			"type": "session.connect",
			"payload": {"id": "experiment_viewer"}
			}
		));


		};

		window.viewer.serverWS.onclose = () => {
			console.log('Experiment viewer closed Connection to server');
		};

		window.viewer.serverWS.onmessage = (event) => {

			let data = event.data;

			if (typeof data !== 'string'){ // msgpack binary (ArrayBuffer or Buffer)
				const bytes = data instanceof ArrayBuffer ? new Uint8Array(data) : new Uint8Array(data.buffer ?? data);
				try{
					const { type, payload } = decode(bytes);
					switch(type){
						case "images.add_panel":
							window.viewer.addPanelImageData(
								payload.image_data, payload.panel_idx, payload.expt_id);
							break;
						case "images.add_expt":
							window.viewer.addExptImageData(
								payload.image_data, payload.expt_id);
							break;
						case "images.add_debug_panel":
							window.viewer.addDebugPanelImageData(
								payload.image_data, payload.mask_data, payload.panel_idx, payload.expt_id);
							break;
						case "images.add_debug":
							window.viewer.addDebugImageData(
								payload.image_data, payload.mask_data);
							break;
						default:
							console.warn("Unrecognised Msgpack message type ", type);
					}
					return;
				}catch(e){
					console.error("Invalid Msgpack", e);
					return;

				}
			}
			const msg = JSON.parse(event.data);
			if (!isExperimentViewerMsg(msg)){
				return;
			}

			const { type, payload } = msg;

			switch(type){
				case "experiment.update":
					console.assert("expt" in payload, "expt not found in experiment.update");
					const exptJSON = payload["expt"];
					console.assert(ExptParser.isExptJSON(exptJSON), "expt is not recognised as an expt JSON string");
					if ("image_data" in payload){
						window.viewer.addExperimentFromJSONString(exptJSON, payload["image_data"]);
					}
					else{
						window.viewer.addExperimentFromJSONString(exptJSON);
					}
					break;
				case "experiment.clear":
					window.viewer.clearExperiment();
					break;
				case "reflections.update":
					window.viewer.addReflectionsFromJSONMsgpack(payload["refl_msgpack"]);
					break;
				case "reflections.update_calculated":
					window.viewer.addCalculatedIntegratedReflectionsFromJSONMsgpack(payload["refl_msgpack"]);
					break;

				case "reflections.highlight":
					window.viewer.highlightReflection(payload);
					break;
				case "settings.update":
					window.viewer.updateSettings(payload);
					break;
				case "images.set_range":
					window.viewer.setImageRange(payload["num_images"], payload["image"], payload["stack"]);
					break;
				case "images.loading":
					window.viewer.showLoadingImagesMsg();
					break;
				case "reflections.loading":
					window.viewer.showLoadingReflectionMsg()
					break;
				case "experiment.select":
					console.assert("expt_id" in payload);
					const exptID = Number(payload["expt_id"]);
					console.assert(typeof exptID === "number" && !Number.isNaN(exptID));
					window.viewer.selectExpt(exptID);
					break;
				case "debug.toggle":
					window.viewer.toggleDebugMode(payload["debug_mode"]);
					break;
				case "debug.set_view":
					if (payload["view"] === "threshold"){
						window.viewer.setDebugToThreshold();
					}
					else{
						window.viewer.setDebugToImage();
					}
					break;
				case "sidebar.toggle":
					window.viewer.toggleSidebar();
					break;
				default:
					console.warn("Unrecognised message type ", type);
			}
		};

		setupScene();
		window.viewer.updateTheme("dark");  
	}
	</script>
